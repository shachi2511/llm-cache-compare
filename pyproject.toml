[project]
name = "llm-cache-compare"
version = "0.1.0"
description = "Replay the same AI-agent workload on OpenAI, Anthropic and Gemini and measure what prompt caching really saves."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shachi Shriwastava" }]
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm_cache_compare"]
